[package]
name = "cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "aacode CLI entry point"

[dependencies]
aa-kernel.workspace = true
aa-function-tools.workspace = true
aa-extension-mcp.workspace = true
aa-core.workspace = true
aa-llm.workspace = true
settings.workspace = true
settings_content.workspace = true
aa-session.workspace = true
aa-server.workspace = true
axum = { workspace = true, features = ["default"] }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
ratatui = "0.30"
crossterm = { version = "0.29", features = ["osc52"] }
pulldown-cmark = "0.13"
anyhow.workspace = true
askpass.workspace = true
clap.workspace = true
clap_complete.workspace = true
clap_complete_nushell.workspace = true
collections.workspace = true
console.workspace = true
dialoguer.workspace = true
ipc-channel = "0.19"
parking_lot.workspace = true
paths.workspace = true
release_channel.workspace = true
serde.workspace = true
serde_json = { workspace = true }
ac_util.workspace = true
util.workspace = true
tempfile.workspace = true
rayon.workspace = true
walkdir = "2.5"

[dev-dependencies]
serde_json.workspace = true
util = { workspace = true, features = ["test-support"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
exec.workspace = true
fork.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation.workspace = true
core-services = "1"
plist = "1.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows.workspace = true

[build-dependencies]
windows_resources = { path = "../../windows_resources" }
