[package]
name = "aacode"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "aacode GPUI desktop client"

# lib 名显式定为 aa_app_lib，与 package 名解耦（改名 package 不影响 lib 的 crate 名）。
[lib]
name = "aa_app_lib"
path = "src/lib.rs"

# package name 与 [[bin]] name 一致 = aacode，与 zed 的约定相同
# （crates/zed → zed/zed、crates/cli → cli/cli）。
[[bin]]
name = "aacode"
path = "src/main.rs"

[features]
tracy = ["ztracing/tracy"]
# LEAK_BACKTRACE=1 cargo run --features zed/track-project-leak --profile release-fast
track-project-leak = ["gpui/leak-detection"]
test-support = [
    "gpui/test-support",
    "gpui_platform/screen-capture",
    "dep:image",
    "workspace/test-support",
    "project/test-support",
    "editor/test-support",
    "terminal_view/test-support",
    "image_viewer/test-support",
    "recent_projects/test-support",
    "repl/test-support",
    "title_bar/test-support",
]
visual-tests = [
    "gpui/test-support",
    "gpui_platform/screen-capture",
    "gpui_platform/test-support",
    "dep:image",
    "dep:tempfile",
    "dep:action_log",
    "dep:agent_servers",
    "workspace/test-support",
    "project/test-support",
    "editor/test-support",
    "terminal_view/test-support",
    "image_viewer/test-support",
    "clock/test-support",
    "acp_thread/test-support",
    "action_log/test-support",
    "agent_ui/test-support",
    "db/test-support",
    "agent/test-support",
    "language_model/test-support",
    "fs/test-support",
    "recent_projects/test-support",
    "title_bar/test-support",
]

[dependencies]
acp_thread.workspace = true
acp_tools.workspace = true
ad_credentials_provider.workspace = true
picker.workspace = true
markdown.workspace = true
migrator.workspace = true
file_finder.workspace = true
call_hierarchy.workspace = true
journal.workspace = true
extensions_ui.workspace = true
web_search_providers.workspace = true
miniprofiler_ui.workspace = true
action_log = { workspace = true, optional = true }
activity_indicator.workspace = true
agent-client-protocol.workspace = true
agent.workspace = true
agent_servers = { workspace = true, optional = true }
agent_settings.workspace = true
agent_skills.workspace = true
agent_ui = { workspace = true, features = ["audio"] }
anyhow.workspace = true
askpass.workspace = true
assets.workspace = true
aa_gpui_kit_assets.workspace = true # 与 assets 不同, 遇到相关问题 需要讨论
audio.workspace = true
auto_update.workspace = true
breadcrumbs.workspace = true
call.workspace = true
channel.workspace = true
chrono.workspace = true
clap.workspace = true
cli.workspace = true
client.workspace = true
clock = { workspace = true, optional = true }
codestral.workspace = true
collab_ui.workspace = true
notifications.workspace = true
collections.workspace = true
command_palette.workspace = true
copilot.workspace = true
copilot_chat.workspace = true
copilot_ui.workspace = true
crashes.workspace = true
dap_adapters.workspace = true
debugger_ui.workspace = true
db.workspace = true
debug_adapter_extension.workspace = true
dev_container.workspace = true
editor.workspace = true
menu.workspace = true
multi_buffer.workspace = true
paths.workspace = true
rope.workspace = true
env_logger.workspace = true
extension.workspace = true
extension_host.workspace = true
fs.workspace = true
futures.workspace = true
git.workspace = true
git_hosting_providers.workspace = true
git_ui = { workspace = true, features = ["call"] }
git_ui_core.workspace = true
go_to_line.workspace = true
gpui = { workspace = true, features = ["profiler", "stacker"] }

gpui_tokio.workspace = true
image = { workspace = true, optional = true }
spin = "0.10.0"
itertools.workspace = true
rayon.workspace = true
semver.workspace = true
tempfile = { workspace = true, optional = true }

edit_prediction.workspace = true
edit_prediction_ui.workspace = true
diagnostics.workspace = true
encoding_selector.workspace = true
toolchain_selector.workspace = true
http_client.workspace = true
image_viewer.workspace = true
language_tools.workspace = true
line_ending_selector.workspace = true
inspector_ui.workspace = true
keymap_editor.workspace = true
lsp_command_selector.workspace = true
lsp_locations.workspace = true
language_extension.workspace = true
debugger_tools.workspace = true
web_search.workspace = true
snippet_provider.workspace = true
outline.workspace = true
tasks_ui.workspace = true
feedback.workspace = true
markdown_preview.workspace = true
svg_preview.workspace = true
json_schema_store.workspace = true
# tabular_data_preview 必须进 [dependencies]（而非仅 dev-dependencies）：它的 action
# （tabular_data::OpenPreview*）要靠 inventory 注册后，内置 keymap 才能解析出绑定。
# 对齐 zed crates/zed/Cargo.toml L138。
# repl 与 tabular_data_preview 同理：action（repl::Run / RunInPlace /
# tabular_data::OpenPreview*）要靠 inventory 注册后内置 keymap 才能解析出绑定。
# 对齐 zed crates/zed/Cargo.toml L138 / L186。
repl.workspace = true
tabular_data_preview.workspace = true
tab_switcher.workspace = true
vim_mode_setting.workspace = true
which_key.workspace = true
ui_prompt.workspace = true
install_cli.workspace = true
project_symbols.workspace = true
auto_update_ui.workspace = true
onboarding.workspace = true
languages = { workspace = true, features = ["load-grammars"] }
language_model.workspace = true
language_models.workspace = true
language_selector.workspace = true

mimalloc = { version = "0.1", optional = true }
recent_projects.workspace = true

sidebar.workspace = true
terminal.workspace = true
terminal_view.workspace = true
title_bar.workspace = true
settings.workspace = true
settings_ui.workspace = true
release_channel.workspace = true
ac_constant.workspace = true
# main.rs 的 single-instance 检查读 ZED_STATELESS（对齐 Zed main.rs L361-362）。
aa_env_vars.workspace = true

tokio.workspace = true
gpui_util.workspace = true
util.workspace = true
search.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
parking_lot = { workspace = true }
# gpui_learn 共享库:内嵌 zed 图标/字体/主题的 assets + 自研 ui 库。
# 开发期 path 依赖;后续可切换成 git 源。
aacode_actions.workspace = true
telemetry.workspace = true
theme.workspace = true
theme_settings.workspace = true
theme_selector.workspace = true
ui.workspace = true
project.workspace = true
shellexpand.workspace = true
project_panel.workspace = true
outline_panel.workspace = true
prompt_store.workspace = true
reqwest_client.workspace = true
language.workspace = true
session.workspace = true
node_runtime.workspace = true
uuid.workspace = true
vim.workspace = true
workspace.workspace = true
watch.workspace = true
zlog.workspace = true
ztracing.workspace = true
gpui_platform = { workspace = true, features = [
    "screen-capture",
    "font-kit",
    "wayland",
    "x11",
] }
# core/open_listener.rs 直接用到这三者（zed 的 crates/zed/Cargo.toml L160/L220/L221
# 同样把它们放在 [dependencies] 而非 dev-dependencies）。
# log     —— 解析失败分支的 log::error!
# url     —— 解析 ssh:// / git 链接的 query 与 Host（parse_ssh_url / parse_git_url）
# urlencoding —— ssh userinfo 里的 percent-decode / re-encode
log.workspace = true
url.workspace = true
urlencoding.workspace = true
# core/open_listener.rs 用到 remote::{RemoteConnectionOptions, WslConnectionOptions}。
# 此前只在 [dev-dependencies]（L254），主二进制链接不到 —— open_listener 移进来后才暴露。
# zed 同样两处都声明（crates/zed/Cargo.toml L184 主依赖 + L269 dev 加 test-support）。
remote.workspace = true
wasm-bindgen = "0.2.120"

[target.'cfg(target_os = "windows")'.dependencies]
etw_tracing.workspace = true
windows.workspace = true
gpui = { workspace = true, features = ["profiler", "windows-manifest"] }

[build-dependencies]
windows_resources = { path = "../../windows_resources" }

# ashpd —— core/mod.rs 的 fail_to_open_window 用 ashpd::desktop::notification
# 在开窗口失败时弹 XDG 桌面通知（对齐 Zed crates/zed/src/main.rs:153-190）。
# 仅 Linux/freebsd 有效，其余平台走 process::exit，与 Zed 一致。
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui = { workspace = true, features = ["profiler", "wayland", "x11"] }
ashpd.workspace = true
image = { workspace = true }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.build-dependencies]
image.workspace = true


[target.'cfg(target_os = "linux")'.build-dependencies]
pkg-config = "0.3.22"



# AppState::test / Project::local 需要的间接依赖（通过 workspace crate re-export 不够，
# main.rs 直接用了这些类型）—— 但 workspace crate 已经声明了它们，这里只需要保证可访问。
# 实际上 main.rs 里 workspace::AppState::test() 内部已经处理了一切，main.rs 只需要 project。



[dev-dependencies]
activity_indicator = { workspace = true, features = ["test-support"] }
call = { workspace = true, features = ["test-support"] }
editor = { workspace = true, features = ["test-support"] }
fs = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["profiler", "test-support"] }
image_viewer = { workspace = true, features = ["test-support"] }
itertools.workspace = true
language = { workspace = true, features = ["test-support"] }
pretty_assertions.workspace = true
project = { workspace = true, features = ["test-support"] }
project_symbols.workspace = true
remote = { workspace = true, features = ["test-support"] }
remote_server = { workspace = true, features = ["test-support"] }
semver.workspace = true
terminal_view = { workspace = true, features = ["test-support"] }
title_bar = { workspace = true, features = ["test-support"] }
workspace = { workspace = true, features = ["test-support"] }
image.workspace = true
agent_ui = { workspace = true, features = ["test-support"] }
search = { workspace = true, features = ["test-support"] }
repl = { workspace = true, features = ["test-support"] }


