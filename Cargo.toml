# 等我们不再依赖 zed git 源后即可整段删除。
# zed git 源里的 crate 也会拖 zed 自己的 `language_core`，与我们的
# 那份 language_core 形成两份 —— 于是 `LanguageConfig` / `LanguageQueries` /
# `LanguageName` 全都"类型不同"（E0308 + 「multiple different versions」）。
# 统一指到本地这份。
[patch."https://github.com/zed-industries/zed"]
language_core = { package = "aa_gpui_kit_language_core", path = "/home/aa/repos/ide_ls/gpui_learn/packages/aa/language_core" }
# util_macros 源码完全一致（sha256 相同），合并成一份：
#   Zed 侧的 util_macros（被 gpui 依赖）→ path patch 到 gpui_learn 的 util_macros
#   与 gpui_learn 侧的 util_macros.workspace = true 最终指向同一份源码
util_macros = { path = "/home/aa/repos/ide_ls/gpui_learn/packages/aa/util_macros" }

# gpui_learn 的 7 个包**全部走本地 path**：改完 gpui_learn 立即生效，不用 commit + 顶 rev。
#
# 当前是个人迭代阶段，构建可复现性不是目标，迭代速度优先。代价是本段含绝对路径，
# 别人 clone 会失败 —— 等到需要协作/发布时再移除（届时 rev 已在
# [workspace.dependencies] 里指向最新提交，移除即可直接用 git 依赖）。
#
# 别把任何一个改回 `git = ..., rev = ...` —— 那会让它停在旧提交，aacode 侧报
# 「找不到刚加的符号」（如 `unresolved import theme::ClientDecorationsExt`），
# 症状很像代码没写。同源要求见下面 ui_input 那条注释。
[patch."https://github.com/Nahida-aa/gpui_learn.git"]
