aa_gpui_kit_ui = { git = "https://github.com/Nahida-aa/gpui_learn.git", rev = "2c77190" }
# zed 里这两个控件包就叫 `ui` / `ui_input`，同样用别名对齐，
# 让照搬的 zed 代码（`ui::Button`、`ui_input::InputField`）零改动。
ui = { package = "aa_gpui_kit_ui", git = "https://github.com/Nahida-aa/gpui_learn.git", rev = "2c77190" }
# zed 里这个包叫 `theme`，别名让照搬的 zed 代码（`theme::SyntaxTheme` 等）原样可用。
# 与 `aa_gpui_kit_theme` 指向同一个包；**每个包只能选其中一个名字声明**，
# 否则会报 "depends on crate ... multiple times with different names"。
theme = { package = "aa_gpui_kit_theme", git = "https://github.com/Nahida-aa/gpui_learn.git", rev = "2c77190" }
# 图标枚举（gpui_learn packages/icons）在 zed 里叫 `icons`，同样用别名对齐。
