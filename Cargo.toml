# 别名为 zed 的新包 `fuzzy_nucleo`：我们对齐的就是它（Case / LengthPenalty /
# match_strings_async / StringMatch.string: SharedString）。成员包二选一，
# 不能同时写 aa_gpui_fuzzy 和 fuzzy_nucleo（同一 crate 两个名字 → Cargo 报错）。
fuzzy_nucleo = { package = "aa_gpui_fuzzy", git = "https://github.com/Nahida-aa/gpui_learn.git", rev = "2c77190" }
aa_gpui_kit_assets = { git = "https://github.com/Nahida-aa/gpui_learn.git", rev = "2c77190" }
