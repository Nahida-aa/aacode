time_format = { codegen-units = 1 }
aa_gpui_kit_ui_input = { codegen-units = 1 }
aacode_actions = { codegen-units = 1 }

[profile.release]
# Zed L1117-1120 是 debug="limited" + lto="thin" + codegen-units=1。
#
# 【有意偏离】lto = false 而非 zed 的 "thin"。
#
# Zed 的 x86_64 Linux 产物在 `namespace-profile-32x64-ubuntu-2004`（**32 核 64 GB**）
# 上构建 —— 见 zed .github/workflows/run_bundling.yml L63。本机 27 GB，可用仅 10 GB。
# thin-LTO 要把全程序所有 crate 的 bitcode 一次性载入内存再做跨 crate 合并，
# 对 250MB .text 的产物是几十 GB 量级的中间表示，必然撑穿：
#     sccache: Compile terminated by signal 15
#     error: could not compile `aacode` (bin "aacode")
#
# 试过但无效的两条（都写在这里免得重蹈）：
#   · 去掉 zed 的 [profile.release.package] zed = { codegen-units = 16 } 例外
#     —— cgu 只影响主二进制自己怎么切分，对 LTO 峰值几乎无影响。
#   · 链接器 GNU ld → lld（-C link-arg=-fuse-ld=lld）
#     —— lld 确实省内存，但瓶颈在 LTO 本身，不在链接器。
#     lld 这条仍保留：链接更快、对 .a 静态库的内存处理也比 GNU ld 友好。
#
# 代价：无跨 crate 优化，体积略大、运行略慢。对本地自用安装无感知差异。
# 若换到大内存机器，把这里改回 lto = "thin" 即可。
debug = "limited"
lto = false
codegen-units = 1

# Zed L1122-1123 还有一条 release 例外 `zed = { codegen-units = 16 }`（放宽主二进制
# 的 cgu 以缩短构建时间），aacode 对应的主二进制 crate 是 `aacode`。
#
# 【有意不搬】27G 内存的机器上，主二进制（链接产物 350MB+）用 lto=thin + cgu=16 会
# 在最后一步把内存吃穿 —— rustc 要同时持有 16 个 CGU 的 bitcode 与 limited 调试信息
# 再做 thin-LTO，swap 耗尽后进程被 SIGTERM 杀掉：
#     sccache: Compile terminated by signal 15
#     error: could not compile `aacode` (bin "aacode")
# cgu=16 的收益是构建更快，与省内存相反；本机内存才是瓶颈，故去掉该例外让主二进制
# 走 cgu=1。若要在内存充裕的机器上换回构建速度，把下面这段取消注释即可。
#
# [profile.release.package]
# aacode = { codegen-units = 16 }

# Zed L1125-1129：带完整符号的快速 release。用于需要真 backtrace 又不想等
# release（LTO + cgu=1）那么久的场景，例如 aacode 的 track-project-leak：
#   LEAK_BACKTRACE=1 cargo run --features aacode/track-project-leak --profile release-fast
[profile.release-fast]
inherits = "release"
debug = "full"
lto = false
codegen-units = 16
