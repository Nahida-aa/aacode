aa_gpui_kit_ui_input = { git = "https://github.com/Nahida-aa/gpui_learn.git", rev = "2c77190" }
ui_input = { package = "aa_gpui_kit_ui_input", git = "https://github.com/Nahida-aa/gpui_learn.git", rev = "2c77190" }
component = { package = "aa_gpui_kit_component", git = "https://github.com/Nahida-aa/gpui_learn.git", rev = "2c77190" }
aa_gpui_kit_component = { git = "https://github.com/Nahida-aa/gpui_learn.git", rev = "2c77190" }
# grammars 指向 gpui_learn（crate 名 aa_gpui_kit_grammars），用 package= 改名，
# 使全仓 `grammars::` 的调用点无需改动。
#
# 为什么不能继续用 zed git 版的 grammars：它内部的 `util::` 解析到 zed 自己的 util
# crate，那个 crate 的 debug-embed 是 opt-in、无 default，于是 fs_embed! 在 debug
# 构建下走 __fs_embed_get，运行时从 `dev_repo_root() + root_relative`
# （"crates/grammars/src"）读文件。对 zed 仓库成立，对 aacode 不成立 ——
# aacode 仓库里既没有 crates/ 目录，grammars 也在 cargo 的 git checkout 里而不在
# aacode 仓库内，于是 get_file() 恒返回 None，languages::init() 构建内置语言表时
# panic：
#   thread 'main' panicked at packages/languages/src/cpp.rs:5:10:
#   missing cpp/semantic_token_rules.json
# 同类的还有 go / python / rust 三个 semantic_token_rules.json。只影响 debug 构建，
# release 走 rust_embed 编译期内嵌故正常。
#
# gpui_learn 版的 grammars 里 `util.workspace = true` 解析到 aa_gpui_kit_util，
# 其 features 段有 `default = ["debug-embed"]`，与仓库布局无关；4 个 json 文件
# （cpp/go/python/rust）都在 packages/grammars/src/ 下。
grammars = { package = "aa_gpui_kit_grammars", git = "https://github.com/Nahida-aa/gpui_learn.git", rev = "2c77190" }

crashes = { git = "https://github.com/zed-industries/zed", rev = "afecd6d719aad92aecfa2860f49c4f2956708831" }
# zed 的模糊匹配正在迁移中：editor / worktree 仍用旧包 `fuzzy`（bool 参数那套
# 签名），language / command_palette 等已迁到 `fuzzy_nucleo`。为了调用点能与 zed
