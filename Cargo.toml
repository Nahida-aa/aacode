# util / util_macros 同样必须走本地，否则图里会同时存在两份：
#   · aacode 自己的 workspace 声明的是 git rev（workspace.dependencies L203-204）
#   · 而 gpui_learn 的 grammars / language_core 里的 `util.workspace = true`
